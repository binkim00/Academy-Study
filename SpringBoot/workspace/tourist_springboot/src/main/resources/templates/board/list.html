<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title> 공지사항 | 고객센터 | 투어리스트인투어 </title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/jquery-1.11.3.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/jquery.smooth-scroll.min.js"></script>
</head>

<body>
<ul class="skipnavi">
    <li><a href="#container">본문내용</a></li>
</ul>

<div id="wrap">
    <div th:replace="fragments/header :: header"></div>

    <div id="container">
        <div class="location_area customer">
            <div class="box_inner">
                <h2 class="tit_page">TOURIST <span class="in">in</span> TOUR</h2>
                <p class="location">고객센터 <span class="path">/</span> 공지사항</p>
                <ul class="page_menu clear">
                    <li><a href="#" class="on">공지사항</a></li>
                    <li><a href="#">문의하기</a></li>
                </ul>
            </div>
        </div>

        <div class="bodytext_area box_inner">
            <form action="/list" method="get" class="minisrch_form">
                <fieldset>
                    <legend>검색</legend>

                    <select name="types" class="select_common">
                        <option value="t" th:selected="${pageRequestDTO.types != null and #arrays.contains(pageRequestDTO.types, 't')}">제목</option>
                        <option value="c" th:selected="${pageRequestDTO.types != null and #arrays.contains(pageRequestDTO.types, 'c')}">내용</option>
                        <option value="w" th:selected="${pageRequestDTO.types != null and #arrays.contains(pageRequestDTO.types, 'w')}">작성자</option>
                    </select>

                    <input type="text" name="keyword" class="tbox"
                           placeholder="검색어를 입력해주세요"
                           th:value="${pageRequestDTO.keyword}">

                    <button class="btn_srch">검색</button>
                    <a class="btn_srch" href="/write">글쓰기</a>
                </fieldset>
            </form>


            <table class="bbsListTbl" summary="번호,제목,조회수,작성일 등을 제공하는 표">
                <caption class="hdd">공지사항 목록</caption>
                <thead>
                <tr>
                    <th scope="col">번호</th>
                    <th scope="col">제목</th>
                    <th scope="col">조회수</th>
                    <th scope="col">작성일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(responseDTO.dtoList)}">
                    <td colspan="4" align="center">등록된 게시물이 없습니다^^*</td>
                </tr>
                <tr th:each="dto, iterStat : ${responseDTO.dtoList}">
                    <td th:text="${displayStartNum - iterStat.index}"></td>
                    <td class="tit_notice">
                        <a th:href="'/read?num=' + ${dto.num} + '&' + ${pageRequestDTO.link}"
                           th:text="${dto.title}"></a>
                    </td>
                    <td th:text="${dto.visitCount}"></td>
                    <td th:text="${#temporals.format(dto.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
                </tbody>
            </table>

            <!-- pagination -->
            <div class="pagination">
                <a th:attr="data-num=1" class="firstpage pbtn">
                    <img th:attr="data-num=1" src="/img/btn_firstpage.png" alt="첫 페이지로 이동">
                </a>

                <a th:if="${responseDTO.prev}" th:attr="data-num=${responseDTO.start - 1}" class="prevpage pbtn">
                    <img th:attr="data-num=${responseDTO.start - 1}" src="/img/btn_prevpage.png" alt="이전 페이지로 이동">
                </a>

                <a th:each="num : ${#numbers.sequence(responseDTO.start, responseDTO.end)}">
                    <span th:attr="data-num=${num}"
                          th:text="${num}"
                          th:class="'pagenum ' + (${num} == ${responseDTO.page} ? 'currentpage' : '')">
                    </span>
                </a>

                <a th:if="${responseDTO.next}" th:attr="data-num=${responseDTO.end + 1}" class="nextpage pbtn">
                    <img th:attr="data-num=${responseDTO.end + 1}" src="/img/btn_nextpage.png" alt="다음 페이지로 이동">
                </a>

                <a th:attr="data-num=${responseDTO.last}" class="lastpage pbtn">
                    <img th:attr="data-num=${responseDTO.last}" src="/img/btn_lastpage.png" alt="마지막 페이지로 이동">
                </a>
            </div>
            <!-- //pagination -->
        </div>
    </div>

    <footer>
        <div class="foot_area box_inner">
            <ul class="foot_list clear">
                <li><a href="javascript:;">이용약관</a></li>
                <li><a href="javascript:;">개인정보취급방침</a></li>
            </ul>
            <h2>투어리스트인투어</h2>
            <p class="addr">서울특별시 종로구 혜화동 9길 청운빌딩 5층</p>
            <p class="copy box_inner">Copyright(c) TouristInTour all right reserved</p>
        </div>
    </footer>
</div>

<h2 class="hdd">빠른 링크</h2>
<div class="quick_area">
    <ul class="quick_list">
        <li><a href="tel:010-7184-4403"><h3>전화 문의</h3><p>010-1234-5678</p></a></li>
        <li><a href="#"><h3>카카오톡 <em>상담</em></h3><p>1:1상담</p></a></li>
        <li><a href="#"><h3 class="to_contact">오시는 길</h3></a></li>
    </ul>
    <p class="to_top"><a href="#layout0" class="s_point">TOP</a></p>
</div>

<script th:inline="javascript">
    let msg = [[${msg}]];
    if(msg){
        alert(msg);
    }

    document.querySelector(".pagination").addEventListener("click", function(e){
        e.preventDefault();
        const target = e.target;
        if(target.tagName !== 'A' && target.tagName !== 'SPAN' && target.tagName !== 'IMG'){
            return;
        }
        const num = target.getAttribute("data-num");
        const formObj = document.querySelector("form");
        formObj.innerHTML += `<input type='hidden' name='page' value='${num}'/>`;
        formObj.submit();
    });
</script>

</body>
</html>
